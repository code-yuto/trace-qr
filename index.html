<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>参加者URL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
<style>
  :root {
    --light: #d5d7d4;
    --dark: #0d0d0d;
    --grid: rgba(13, 13, 13, 0.12);
    --split: 52%;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--dark);
    color: var(--light);
    font-family: "Noto Sans JP", system-ui, sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    min-height: 100%;
    height: 100dvh;
    display: grid;
    place-items: center;
    background:
      linear-gradient(var(--light), var(--light)) top / 100% var(--split) no-repeat,
      var(--dark);
  }
  .grid {
    position: absolute;
    inset: 0 0 calc(100% - var(--split)) 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: clamp(48px, 9vmin, 96px) clamp(48px, 9vmin, 96px);
    pointer-events: none;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 28px;
    height: 28px;
    border: 0 solid currentColor;
  }
  .corner.tl { top: 14px; left: 14px; border-top-width: 2px; border-left-width: 2px; color: var(--dark); }
  .corner.tr { top: 14px; right: 14px; border-top-width: 2px; border-right-width: 2px; color: var(--dark); }
  .corner.bl { bottom: 14px; left: 14px; border-bottom-width: 2px; border-left-width: 2px; color: var(--light); }
  .corner.br { bottom: 14px; right: 14px; border-bottom-width: 2px; border-right-width: 2px; color: var(--light); }

  .center {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(20px, 4vmin, 40px);
    padding: 16px;
  }
  .qr {
    position: relative;
    padding: clamp(18px, 3.5vmin, 36px);
    background: #fff;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
  }
  .qr .mark {
    position: absolute;
    width: 32px;
    height: 32px;
    border: 0 solid;
  }
  .qr .mark.tl { top: -14px; left: -14px; border-top-width: 2px; border-left-width: 2px; border-color: var(--dark); }
  .qr .mark.tr { top: -14px; right: -14px; border-top-width: 2px; border-right-width: 2px; border-color: var(--dark); }
  .qr .mark.bl { bottom: -14px; left: -14px; border-bottom-width: 2px; border-left-width: 2px; border-color: var(--light); }
  .qr .mark.br { bottom: -14px; right: -14px; border-bottom-width: 2px; border-right-width: 2px; border-color: var(--light); }
  .qr img {
    display: block;
    width: min(60vmin, calc(100vw - 120px), 520px);
    height: auto;
    image-rendering: pixelated;
  }
  h1 {
    font-size: clamp(32px, 7vmin, 72px);
    font-weight: 900;
    letter-spacing: 0.08em;
    line-height: 1;
    color: var(--light);
  }
</style>
</head>
<body>
<main class="stage">
  <div class="grid" aria-hidden="true"></div>
  <canvas id="ray" aria-hidden="true"></canvas>
  <span class="corner tl" aria-hidden="true"></span>
  <span class="corner tr" aria-hidden="true"></span>
  <span class="corner bl" aria-hidden="true"></span>
  <span class="corner br" aria-hidden="true"></span>
  <div class="center">
    <div class="qr">
      <span class="mark tl"></span><span class="mark tr"></span><span class="mark bl"></span><span class="mark br"></span>
      <img src="qr.png" alt="参加者URLのQRコード">
    </div>
    <h1>参加者URL</h1>
  </div>
</main>
<script>
(() => {
  const canvas = document.getElementById("ray");
  const ctx = canvas.getContext("2d");
  if (!ctx) throw new Error("Canvas 2D context is not available");

  const DOT = 4;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Pseudo-random hash so the dither pattern is stable per cell.
  const hash = (x, y) => {
    const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return s - Math.floor(s);
  };

  // Density of a diagonal light beam, falling from top-right toward the split line.
  const beam = (x, y, w, h, t) => {
    const splitY = h * 0.52;
    const startX = w * 0.97, startY = h * 0.12;
    const endX = w * 0.89, endY = splitY;
    const dx = endX - startX, dy = endY - startY;
    const len = Math.hypot(dx, dy);
    const u = ((x - startX) * dx + (y - startY) * dy) / (len * len);
    const dist = Math.abs((x - startX) * dy - (y - startY) * dx) / len;
    const along = Math.min(Math.max(u, 0), 1);
    const width = 4 + along * along * 40;
    const core = Math.max(0, 1 - dist / width) * along;
    const splash = Math.max(0, 1 - Math.hypot((x - endX) / (w * 0.09), (y - endY) / 22));
    const flicker = 0.85 + 0.15 * Math.sin(t * 0.002 + y * 0.05);
    return Math.max(core, splash * 0.9) * flicker;
  };

  const draw = (t) => {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    const splitY = h * 0.52;
    for (let y = 0; y < h * 0.62; y += DOT) {
      for (let x = w * 0.6; x < w; x += DOT) {
        const d = beam(x, y, w, h, t);
        if (d > 0 && hash(x, y) < d) {
          ctx.fillStyle = y < splitY ? "#0d0d0d" : "#d5d7d4";
          ctx.fillRect(x, y, DOT - 1, DOT - 1);
        }
      }
    }
  };

  const resize = () => {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(performance.now());
  };

  window.addEventListener("resize", resize);
  resize();

  if (!reduceMotion) {
    const loop = (t) => { draw(t); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
