<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>参加者URL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
<style>
  :root {
    --light: #d5d7d4;
    --dark: #0d0d0d;
    --grid: rgba(13, 13, 13, 0.12);
    --split: 52%;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--dark);
    color: var(--light);
    font-family: "Noto Sans JP", system-ui, sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    min-height: 100%;
    height: 100dvh;
    display: grid;
    place-items: center;
    background:
      linear-gradient(var(--light), var(--light)) top / 100% var(--split) no-repeat,
      var(--dark);
  }
  .grid {
    position: absolute;
    inset: 0 0 calc(100% - var(--split)) 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: clamp(48px, 9vmin, 96px) clamp(48px, 9vmin, 96px);
    pointer-events: none;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 28px;
    height: 28px;
    border: 0 solid currentColor;
  }
  .corner.tl { top: 14px; left: 14px; border-top-width: 2px; border-left-width: 2px; color: var(--dark); }
  .corner.tr { top: 14px; right: 14px; border-top-width: 2px; border-right-width: 2px; color: var(--dark); }
  .corner.bl { bottom: 14px; left: 14px; border-bottom-width: 2px; border-left-width: 2px; color: var(--light); }
  .corner.br { bottom: 14px; right: 14px; border-bottom-width: 2px; border-right-width: 2px; color: var(--light); }

  .center {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(20px, 4vmin, 40px);
    padding: 16px;
  }
  .qr {
    position: relative;
    padding: clamp(18px, 3.5vmin, 36px);
    background: #fff;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
  }
  .qr .mark {
    position: absolute;
    width: 32px;
    height: 32px;
    border: 0 solid;
  }
  .qr .mark.tl { top: -14px; left: -14px; border-top-width: 2px; border-left-width: 2px; border-color: var(--dark); }
  .qr .mark.tr { top: -14px; right: -14px; border-top-width: 2px; border-right-width: 2px; border-color: var(--dark); }
  .qr .mark.bl { bottom: -14px; left: -14px; border-bottom-width: 2px; border-left-width: 2px; border-color: var(--light); }
  .qr .mark.br { bottom: -14px; right: -14px; border-bottom-width: 2px; border-right-width: 2px; border-color: var(--light); }
  .qr img {
    display: block;
    width: min(60vmin, calc(100vw - 120px), 520px);
    height: auto;
    image-rendering: pixelated;
  }
  h1 {
    font-size: clamp(32px, 7vmin, 72px);
    font-weight: 900;
    letter-spacing: 0.08em;
    line-height: 1;
    color: var(--light);
  }
</style>
</head>
<body>
<main class="stage">
  <div class="grid" aria-hidden="true"></div>
  <canvas id="campus" aria-hidden="true"></canvas>
  <span class="corner tl" aria-hidden="true"></span>
  <span class="corner tr" aria-hidden="true"></span>
  <span class="corner bl" aria-hidden="true"></span>
  <span class="corner br" aria-hidden="true"></span>
  <div class="center">
    <div class="qr">
      <span class="mark tl"></span><span class="mark tr"></span><span class="mark bl"></span><span class="mark br"></span>
      <img src="qr.png" alt="参加者URLのQRコード">
    </div>
    <h1>参加者URL</h1>
  </div>
</main>
<script>
(() => {
  const canvas = document.getElementById("campus");
  const ctx = canvas.getContext("2d");
  if (!ctx) throw new Error("Canvas 2D context is not available");

  const INK = "13, 13, 13";
  const PAPER = "213, 215, 212";
  const SPLIT = 0.52;
  const PITCH = 0.5;
  const TURN_PER_MS = (Math.PI * 2) / 60000;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Campus metres (x east, y north, z up) -> scene (x right, y up, z toward the viewer at yaw 0).
  const toScene = ([x, y], z, c) => [x - c[0], z, -(y - c[1])];

  const loopSegments = (loops, z, c, out) => {
    for (const loop of loops) {
      loop.forEach((p, i) => out.push([toScene(p, z, c), toScene(loop[(i + 1) % loop.length], z, c)]));
    }
  };

  // Same layers as the /log trace view: every floor faint, roofs and corner edges stronger.
  const buildLayers = (data) => {
    const points = data.buildings.flatMap((b) => b.footprint.flat());
    const xs = points.map((p) => p[0]);
    const ys = points.map((p) => p[1]);
    const c = [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2];
    const floors = [];
    const frame = [];
    for (const b of data.buildings) {
      for (const f of b.floors) loopSegments(f.outlines.length ? f.outlines : b.footprint, f.z, c, floors);
      const top = b.floors.at(-1);
      loopSegments(top && top.outlines.length ? top.outlines : b.footprint, b.roofZ, c, frame);
      loopSegments(b.footprint, 0, c, frame);
      for (const loop of b.footprint) for (const p of loop) frame.push([toScene(p, 0, c), toScene(p, b.roofZ, c)]);
    }
    const radius = Math.max(...points.map(([x, y]) => Math.hypot(x - c[0], y - c[1])));
    const height = Math.max(...data.buildings.map((b) => b.roofZ));
    const [sx, sy, sz] = data.shibalab;
    return { layers: [{ segments: floors, alpha: 0.2 }, { segments: frame, alpha: 0.45 }], radius, height, mark: toScene([sx, sy], sz, c) };
  };

  const start = (model) => {
    let w = 0, h = 0;

    const project = (p, yaw, view) => {
      const cos = Math.cos(yaw), sin = Math.sin(yaw);
      const x = p[0] * cos - p[2] * sin;
      const z = p[0] * sin + p[2] * cos;
      const y = p[1] - model.height * 0.4;
      const up = y * Math.cos(PITCH) - z * Math.sin(PITCH);
      const depth = view.dist - (z * Math.cos(PITCH) + y * Math.sin(PITCH));
      const k = view.scale * view.dist / depth;
      return [view.cx + x * k, view.cy - up * k];
    };

    // Wide screens: to the right of the QR, astride the split. Tall screens: under the QR.
    const layoutBox = (splitY) => {
      if (w / h >= 1.25) {
        const qr = document.querySelector(".center").getBoundingClientRect();
        const left = qr.right + 14;
        return { cx: (left + w) / 2, cy: splitY, w: (w - left) * 0.6, h: h * 0.3 };
      }
      const text = document.querySelector("h1").getBoundingClientRect();
      const top = text.bottom + 16;
      return { cx: w / 2, cy: (top + h) / 2 + 8, w: w * 0.6, h: Math.max(60, (h - top) * 0.5) };
    };

    const stroke = (segments, yaw, view) => {
      ctx.beginPath();
      for (const [a, b] of segments) {
        const pa = project(a, yaw, view), pb = project(b, yaw, view);
        ctx.moveTo(pa[0], pa[1]);
        ctx.lineTo(pb[0], pb[1]);
      }
      ctx.stroke();
    };

    // The campus straddles the split, drawn in ink over the paper and in paper over the ink.
    const draw = (t) => {
      const yaw = 0.42 + (reduceMotion ? 0 : t * TURN_PER_MS);
      const splitY = h * SPLIT;
      const box = layoutBox(splitY);
      const scale = Math.min(box.w / (2 * model.radius), box.h / (2 * model.radius * Math.sin(PITCH) + model.height * Math.cos(PITCH)));
      const view = { cx: box.cx, cy: box.cy, scale, dist: model.radius * 7 };
      ctx.clearRect(0, 0, w, h);
      ctx.lineWidth = 1;
      const pulse = (t % 2400) / 2400;
      const m = project(model.mark, yaw, view);
      for (const [rgb, y0, y1] of [[INK, 0, splitY], [PAPER, splitY, h]]) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, y0, w, y1 - y0);
        ctx.clip();
        for (const layer of model.layers) {
          ctx.strokeStyle = `rgba(${rgb}, ${layer.alpha})`;
          stroke(layer.segments, yaw, view);
        }
        // ShibaLab: a dot with a ring spreading from it.
        ctx.fillStyle = `rgb(${rgb})`;
        ctx.fillRect(m[0] - 3, m[1] - 3, 6, 6);
        ctx.strokeStyle = `rgba(${rgb}, ${reduceMotion ? 0.8 : 1 - pulse})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(m[0], m[1], 6 + (reduceMotion ? 6 : pulse * 22), 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = 1;
        ctx.restore();
      }
    };

    const resize = () => {
      const dpr = window.devicePixelRatio || 1;
      w = canvas.clientWidth;
      h = canvas.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw(performance.now());
    };

    window.addEventListener("resize", resize);
    resize();
    if (!reduceMotion) {
      const loop = (t) => { draw(t); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    }
  };

  fetch("campus.json")
    .then((res) => {
      if (!res.ok) throw new Error(`campus.json: HTTP ${res.status}`);
      return res.json();
    })
    .then((data) => start(buildLayers(data)))
    .catch((err) => console.error("Failed to draw the campus:", err));
})();
</script>
</body>
</html>
